[build]
  command = "pnpm auth:build"
  publish = "netlify-auth-dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.25.0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
