<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#7948f5">
    <title>خدمة مصادقة توثيق الأول</title>
    <style>
      :root { color: #111827; background: #f8fafd; font-family: Arial, sans-serif; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; padding: 1rem; place-items: center; }
      main { width: min(100%, 34rem); padding: 2.5rem 2rem; border: 1px solid #e5eaf2; border-radius: 8px; background: #fff; box-shadow: 0 16px 40px rgba(17, 24, 39, 0.06); }
      h1 { margin: 0 0 0.75rem; font-size: clamp(1.6rem, 5vw, 2.15rem); text-align: center; }
      .lead { margin: 0 auto 1.75rem; color: #667085; line-height: 1.8; text-align: center; }
      form { display: grid; gap: 1rem; }
      form[hidden] { display: none; }
      label { display: grid; gap: 0.45rem; color: #344054; font-weight: 700; }
      input { width: 100%; min-height: 46px; padding: 0.7rem 0.85rem; border: 1px solid #d7dce5; border-radius: 6px; background: #fff; color: #111827; font: inherit; direction: ltr; }
      input:focus { border-color: #7948f5; outline: 3px solid #eee8ff; }
      button { min-height: 46px; padding: 0.7rem 1.25rem; border: 0; border-radius: 6px; color: #fff; background: #7948f5; cursor: pointer; font: inherit; font-weight: 700; }
      button:disabled { cursor: wait; opacity: 0.65; }
      button.secondary { border: 1px solid #d7dce5; color: #344054; background: #fff; }
      button.link { min-height: auto; padding: 0.25rem; color: #6941c6; background: transparent; font-weight: 500; }
      .actions { display: grid; gap: 0.65rem; }
      .hint { margin: 0; color: #667085; font-size: 0.88rem; line-height: 1.7; text-align: center; }
      .status { min-height: 1.5rem; margin-top: 1rem; color: #667085; font-size: 0.92rem; line-height: 1.7; text-align: center; }
      .status[data-kind="error"] { color: #b42318; }
      .status[data-kind="success"] { color: #067647; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">خدمة مصادقة توثيق الأول</h1>
      <p id="message" class="lead">سجّل الدخول بأمان للوصول إلى لوحة إدارة التوثيق.</p>

      <form id="password-form" hidden>
        <label>كلمة المرور الجديدة<input id="new-password" name="password" type="password" minlength="8" autocomplete="new-password" required></label>
        <label>تأكيد كلمة المرور<input id="confirm-password" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></label>
        <button type="submit">حفظ كلمة المرور والمتابعة</button>
        <p class="hint">استخدم ثمانية أحرف على الأقل، ولا تشارك كلمة المرور أو رابط البريد مع أي شخص.</p>
      </form>

      <form id="login-form">
        <label>البريد الإلكتروني<input id="email" name="email" type="email" autocomplete="username" required></label>
        <label>كلمة المرور<input id="password" name="password" type="password" autocomplete="current-password" required></label>
        <div class="actions">
          <button type="submit">تسجيل الدخول إلى لوحة الإدارة</button>
          <button id="show-recovery" class="link" type="button">نسيت كلمة المرور؟</button>
        </div>
        <p class="hint">إنشاء الحساب لأول مرة متاح فقط من رابط الدعوة المرسل إلى بريدك.</p>
      </form>

      <form id="recovery-form" hidden>
        <label>البريد الإلكتروني<input id="recovery-email" name="email" type="email" autocomplete="email" required></label>
        <div class="actions">
          <button type="submit">إرسال رابط استعادة كلمة المرور</button>
          <button id="show-login" class="secondary" type="button">العودة إلى تسجيل الدخول</button>
        </div>
      </form>

      <div id="status" class="status" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
